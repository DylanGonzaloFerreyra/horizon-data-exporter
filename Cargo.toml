[package]
name = "horizon-data-exporter"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "A native Horizon mod that saves what happens in your game to files on your computer"

[lib]
# This exact source is also injected into the game as a module by horizon-mixins.
path = "mixins/data_exporter/runtime.rs"

[dependencies]
serde_json = "1"

[workspace]
resolver = "2"
