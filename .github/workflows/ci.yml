name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: python3 tools/package.py
